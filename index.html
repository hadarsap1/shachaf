<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>שחף+</title>

    <!-- The stylesheet pulls Heebo/Inter from Google Fonts, which blocks first
         paint until that third party answers. Opening the connections early
         takes the DNS+TLS round trips off the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PWA -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="שחף+ — הפלטפורמה הקהילתית של קהילת שחף" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link preview for the app itself. A shared EVENT gets its own card from
         api/event-preview (/e/<id>); this is the fallback for every other link
         to the app. Both say the same thing on purpose — the app's identity
         and nothing about any member or event, since a preview is fetched
         without a sign-in and travels with the message. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="שחף+" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="שחף+" />
    <meta property="og:description" content="הפלטפורמה הקהילתית של קהילת שחף" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="שחף+" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/rescue.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
